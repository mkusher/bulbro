name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run types
      - run: bun test
        working-directory: web
      - run: bun test
        working-directory: server
      - run: bun test
        working-directory: packages/network-protocol
      - run: bun test
        working-directory: packages/network-integration-tests
      - run: bun run check
